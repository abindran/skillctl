name: Release

# A tag vX.Y.Z (matching Cargo.toml) produces a signed-when-possible universal
# macOS binary, verifies it on a clean runner, publishes a GitHub release with
# the tarball and its SHA-256, and publishes the crate to crates.io when a
# CARGO_REGISTRY_TOKEN secret is configured.

'on':
  push:
    tags:
      - 'v*'
  # Re-run for an existing tag (for example after adding CARGO_REGISTRY_TOKEN):
  # gh workflow run release.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast

  build:
    name: Universal macOS binary
    needs: checks
    runs-on: macos-14
    outputs:
      version: ${{ steps.meta.outputs.version }}
      archive: ${{ steps.meta.outputs.archive }}
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Check that the tag matches Cargo.toml
        id: meta
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=skillctl-$version-macos-universal.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Build both targets and join them with lipo
        env:
          SKILLCTL_COMMIT: ${{ github.sha }}
        run: scripts/release/build-universal.sh
      - name: Sign and notarize
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: scripts/release/sign-and-notarize.sh dist/skillctl
      - name: Package tarball and checksum
        run: scripts/release/package.sh "${{ steps.meta.outputs.version }}"
      - name: Check that the crate packages cleanly
        run: cargo publish --dry-run --locked
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  verify:
    name: End-to-end scenario on a clean runner
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Verify checksum, unpack and run the scenario
        run: |
          (cd dist && shasum -a 256 -c "${{ needs.build.outputs.archive }}.sha256")
          tar -xzf "dist/${{ needs.build.outputs.archive }}" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/skillctl" --version
          scripts/release/smoke.sh "$RUNNER_TEMP/skillctl"

  publish:
    name: GitHub release
    needs: [build, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Create or update the release with tarball and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="dist/${{ needs.build.outputs.archive }} dist/${{ needs.build.outputs.archive }}.sha256"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $assets
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "skillctl ${{ needs.build.outputs.version }}" \
              --generate-notes \
              $assets
          fi

  crate:
    name: Publish to crates.io
    needs: [build, verify]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: cargo publish
        id: publish
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not configured; the crate was not published"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo publish --locked
          echo "published=true" >> "$GITHUB_OUTPUT"

  verify-crate:
    name: cargo install from crates.io
    needs: [build, crate]
    if: needs.crate.outputs.published == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install the published crate and run the scenario
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])')"
          version="${{ needs.build.outputs.version }}"
          # crates.io indexes a new version within a minute or so.
          for attempt in 1 2 3 4 5 6; do
            if cargo install --locked "$crate" --version "$version"; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 30
          done
          skillctl --version
          scripts/release/smoke.sh skillctl
