name: macOS app

on:
  push:
    branches: [main]
    paths: ["ui/**", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["ui/**", ".github/workflows/swift.yml"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI the end-to-end tests drive
        run: cargo build --locked
      - name: Build the SwiftUI app
        working-directory: ui/SkillctlApp
        run: swift build -c release
      - name: End-to-end tests (app state layer against the real binary)
        working-directory: ui/SkillctlApp
        run: swift test
      - name: Bundle and zip Skillctl.app
        # The zip keeps symlinks, executable bits and the signature; a bare .app in an artifact loses them.
        run: ui/SkillctlApp/Scripts/bundle.sh release && ui/SkillctlApp/Scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Skillctl.app
          path: ui/SkillctlApp/dist/Skillctl-*.zip
          if-no-files-found: error
