[package]
name = "skillctl"
edition = "2024"
version = "0.1.0"
authors = ["abindran"]
description = "A CLI tool for managing skills"
rust-version = "1.85"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
dirs = "7.0.0"
semver = "1.0.28"
serde_yaml_ng = "0.10.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
tempfile = "3.27.0"
dialoguer = { version = "0.12.0", default-features = false }
fd-lock = "4.0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
