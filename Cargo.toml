[package]
# crates.io already has an unrelated "skillctl"; the crate is skillctl-cli and
# the installed binary is still called skillctl.
name = "skillctl-cli"
edition = "2024"
version = "0.1.0"
authors = ["Abindran <abindranr@gmail.com>"]
description = "Store Agent Skills once and symlink them into projects for Claude Code, Cursor and ZohoCode"
repository = "https://github.com/abindran/skillctl"
homepage = "https://github.com/abindran/skillctl"
readme = "README.md"
keywords = ["agent-skills", "claude-code", "cursor", "cli", "symlink"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
exclude = ["/.github", "/wiki", "/scripts", "/dist", "/.zcode"]

[lib]
name = "skillctl"
path = "src/lib.rs"

[[bin]]
name = "skillctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
dirs = "7.0.0"
semver = { version = "1.0.28", features = ["serde"] }
serde_yaml_ng = "0.10.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
tempfile = "3.27.0"
dialoguer = { version = "0.12.0", default-features = false }
fd-lock = "4.0.4"
# 0.11.1 raises the MSRV to 1.88; keep compatibility with Rust 1.85.
sha2 = "=0.11.0"
hex = "0.4.3"
regex = "1.13.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
quick-junit = "0.8.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
