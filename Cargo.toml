[package]
name = "skillctl"
edition = "2024"
version = "0.1.0"
authors = ["abindran"]
description = "A CLI tool for managing skills"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
